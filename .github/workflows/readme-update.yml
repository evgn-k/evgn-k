name: Обновление README

on:
  schedule:
    # Минута смещена, чтобы не попадать в общую очередь GitHub на :00.
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/readme-update.yml'

permissions:
  contents: write

concurrency:
  group: readme-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Подтянуть посты из RSS
        run: python3 scripts/update_readme.py

      - name: Закоммитить, если README изменился
        run: |
          if git diff --quiet -- README.md; then
            echo "Изменений нет, коммит не нужен."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'chore: обновлены посты из блога'
          git push
